<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta
      name="description"
      content="Md Jannatul Ferdhous Emon — Assistant Front-End Developer. MERN stack, React, .NET, competitive programmer. Portfolio, projects and blog."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Md Jannatul Ferdhous Emon" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph / social: static fallback for non-JS scrapers;
         per-route tags are managed at runtime by react-helmet-async. -->
    <meta property="og:site_name" content="Md Jannatul Ferdhous Emon" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Md Jannatul Ferdhous Emon — Developer Portfolio" />
    <meta
      property="og:description"
      content="Assistant Front-End Developer building responsive, dynamic MERN apps."
    />
    <meta property="og:url" content="https://jfemon.vercel.app/" />
    <meta property="og:image" content="https://jfemon.vercel.app/og.png" />
    <meta
      property="og:image:alt"
      content="Md Jannatul Ferdhous Emon — Developer Portfolio"
    />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Md Jannatul Ferdhous Emon — Developer Portfolio"
    />
    <meta
      name="twitter:description"
      content="Assistant Front-End Developer building responsive, dynamic MERN apps."
    />
    <meta name="twitter:image" content="https://jfemon.vercel.app/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-render-blocking font CSS: preload, then swap media to 'all'
         on load (display=swap already avoids FOIT). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      />
    </noscript>
    <title>Md Jannatul Ferdhous Emon — Developer Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
